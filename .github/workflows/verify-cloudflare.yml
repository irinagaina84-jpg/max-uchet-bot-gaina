name: Verify MAX bot v68

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build current Docker image
        run: docker build -t max-bot-current .
      - name: Verify current export source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BOT_IMAGE_REVISION=v68-streaming-media-export-20260828-1' Dockerfile
          grep -q 'node patch-v68-streaming-media-export.mjs' Dockerfile
          grep -q 'worker-v68-streaming-container-proxy-r2' worker-v67.js
          grep -Eq '"main"[[:space:]]*:[[:space:]]*"worker-v67\.js"' wrangler.jsonc
          grep -q '/export/media' worker-v67.js
          echo 'v68 source is buildable'

  verify-live:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Cloudflare deployment and verify public endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 36); do
            ROOT_CODE="$(curl -sS -o /tmp/root.txt -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/" || true)"
            MEDIA_CODE="$(curl -sS -o /tmp/media.txt -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/export/media?mode=all" || true)"
            DIAG_CODE="$(curl -sS -o /tmp/diag.txt -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/diagnostic" || true)"
            echo "===== ATTEMPT $i ====="
            echo "root=$ROOT_CODE body=$(head -c 500 /tmp/root.txt 2>/dev/null || true)"
            echo "media=$MEDIA_CODE body=$(head -c 500 /tmp/media.txt 2>/dev/null || true)"
            echo "diag=$DIAG_CODE body=$(head -c 1000 /tmp/diag.txt 2>/dev/null || true)"
            if [ "$MEDIA_CODE" = "403" ] && grep -q 'Forbidden' /tmp/media.txt; then
              echo 'LIVE_V68_EXPORT_ENDPOINT_OK'
              exit 0
            fi
            sleep 15
          done
          echo 'LIVE_V68_ENDPOINT_NOT_READY'
          exit 1
