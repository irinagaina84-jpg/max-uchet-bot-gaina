name: Verify Bitrix project accounting setup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for deploy, then configure clients and boards once
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 24); do
            CODE="$(curl -sS -o /tmp/result.json -w '%{http_code}' --connect-timeout 10 --max-time 180 "$BASE/bitrix/crm-boards" || true)"
            echo "attempt=$i code=$CODE body=$(cat /tmp/result.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ] \
              && grep -q 'worker-v102-bitrix-crm-boards' /tmp/result.json \
              && grep -q '"clientsReady":true' /tmp/result.json \
              && grep -q '"ordersBoardReady":true' /tmp/result.json \
              && grep -q '"paymentsBoardReady":true' /tmp/result.json; then
              echo 'BITRIX_CRM_BOARDS_READY'
              exit 0
            fi
            sleep 10
          done
          exit 1
