name: Configure Bitrix CRM card

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify operational status field
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          curl -sS --connect-timeout 10 --max-time 120 "$BASE/bitrix/crm/audit" | tee /tmp/final.json
          grep -Eq '"fieldCount":(15|1[5-9]|[2-9][0-9])' /tmp/final.json
          grep -q 'UF_CRM_OP_STATUS' /tmp/final.json
