name: Verify Bitrix import bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for approved import bridge
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 30); do
            CODE="$(curl -sS -o /tmp/status.json -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/bitrix/import-approved/status" || true)"
            echo "attempt=$i code=$CODE body=$(cat /tmp/status.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ] && grep -q 'worker-v80-bitrix-approved-import' /tmp/status.json && grep -q '"approvedCount":7' /tmp/status.json; then
              echo 'BITRIX_APPROVED_IMPORT_READY'
              exit 0
            fi
            sleep 10
          done
          exit 1
