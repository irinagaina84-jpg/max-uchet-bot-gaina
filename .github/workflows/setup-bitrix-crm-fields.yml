name: Configure Bitrix CRM container fields

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fields:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for CRM worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 30); do
            CODE="$(curl -sS -o /tmp/status.json -w '%{http_code}' --connect-timeout 10 --max-time 40 "$BASE/bitrix/crm/setup/status" || true)"
            echo "attempt=$i code=$CODE body=$(head -c 600 /tmp/status.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ] && grep -q 'worker-v91-bitrix-crm-containers' /tmp/status.json; then break; fi
            sleep 10
          done
          grep -q 'worker-v91-bitrix-crm-containers' /tmp/status.json

      - name: Create working fields without new funnel
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for BATCH in 1 2 3; do
            OK=0
            for TRY in 1 2 3; do
              CODE="$(curl -sS -o /tmp/f-$BATCH.json -w '%{http_code}' --connect-timeout 10 --max-time 180 "$BASE/bitrix/crm/setup/fields?batch=$BATCH" || true)"
              echo "batch=$BATCH try=$TRY code=$CODE"; cat /tmp/f-$BATCH.json
              if [ "$CODE" = "200" ] && grep -q '"ok":true' /tmp/f-$BATCH.json; then OK=1; break; fi
              sleep 8
            done
            test "$OK" = "1"
          done

      - name: Verify fields
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          curl -sS --connect-timeout 10 --max-time 120 "$BASE/bitrix/crm/setup/status" | tee /tmp/final.json
          grep -Eq '"fieldCount":(14|1[4-9]|[2-9][0-9])' /tmp/final.json
          echo 'BITRIX_CONTAINER_FIELDS_READY'
