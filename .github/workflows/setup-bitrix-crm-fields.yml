name: Configure Bitrix CRM container fields

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing container fields
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          curl -sS --connect-timeout 10 --max-time 120 "$BASE/bitrix/crm/setup/status" | tee /tmp/status.json
          grep -Eq '"fieldCount":(14|1[4-9]|[2-9][0-9])' /tmp/status.json
