name: Check Bitrix catalog scope once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for v111 and check catalog scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 24); do
            CODE="$(curl -sS -o /tmp/catalog.json -w '%{http_code}' --connect-timeout 10 --max-time 60 "$BASE/bitrix/check-catalog" || true)"
            echo "attempt=$i code=$CODE body=$(cat /tmp/catalog.json 2>/dev/null || true)"
            if grep -q 'worker-v111-catalog-check' /tmp/catalog.json 2>/dev/null; then
              if [ "$CODE" = "200" ] && grep -q '"ok":true' /tmp/catalog.json; then
                echo 'BITRIX_CATALOG_SCOPE_OK'
                exit 0
              fi
              echo 'BITRIX_CATALOG_SCOPE_NOT_OK'
              exit 2
            fi
            sleep 8
          done
          echo 'BITRIX_CATALOG_CHECK_TIMEOUT'
          exit 3
