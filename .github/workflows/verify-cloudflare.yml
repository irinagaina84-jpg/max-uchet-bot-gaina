name: Verify Cloudflare seeded chat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for seeded current chat
        shell: bash
        run: |
          set -euo pipefail
          FULL_URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic/full"
          DIAG_URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic"
          for i in $(seq 1 24); do
            DIAG="$(curl -fsS --max-time 20 "$DIAG_URL" || true)"
            sleep 2
            FULL="$(curl -fsS --max-time 20 "$FULL_URL" || true)"
            echo "Attempt $i diagnostic: $DIAG"
            echo "Attempt $i full: $FULL"
            if echo "$FULL" | grep -q '"workerVersion":"worker-v42-current-chat-seeded"' \
              && echo "$FULL" | grep -q '"version":"v42-max-history-fixed"' \
              && echo "$FULL" | grep -q '"maxAuthorized":true' \
              && echo "$FULL" | grep -q '"gigachatAuthorized":true' \
              && echo "$FULL" | grep -Eq '"knownGroupCount":[1-9][0-9]*'; then
              echo "Cloudflare stable v42 is live with current chat seeded"
              exit 0
            fi
            sleep 13
          done
          echo "Current chat was not seeded into stable v42 within 6 minutes"
          exit 1
