name: Verify MAX bot v57

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: cp package-final.json package.json && npm install --omit=dev
      - name: Build bot exactly like Docker
        shell: bash
        run: |
          set -euo pipefail
          cp bot-giga-v14.js bot.js
          node patch-v14-fullchat.mjs
          node patch-v14-silent.mjs
          node patch-v14-webhook.mjs
          node patch-v14-block-stale.mjs
          node patch-v14-max-history.mjs
          node patch-v14-freshscope.mjs
          node patch-v14-dialog-routing.mjs
          node patch-v14-private-owner.mjs
          node patch-v14-accounting-accuracy.mjs
          node patch-v14-release-series.mjs
          node patch-v14-text-release-logic.mjs
          node patch-v14-openai-brain.mjs
          node patch-v14-semantic-thread.mjs
          node patch-v56-ledger-compat.mjs
          node patch-v14-persistent-ledger-v2.mjs
          node patch-v56-ledger-safety.mjs
          node patch-v57-ledger-backfill-gate.mjs
          node --check bot.js
          node --check worker.js
          node --check worker-v57.js
          grep -q 'v57-ledger-backfill-gate' bot.js
          grep -q 'v57-ledger-parser' bot.js
          grep -q 'ledgerBackfillGate: true' bot.js
          grep -q 'persistentAccountingLedger: true' bot.js
          grep -q 'deterministicLedgerTotals: true' bot.js
          grep -q '"main": "worker-v57.js"' wrangler.jsonc
          echo 'v57 ledger backfill gate built successfully'

  verify-live:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Cloudflare v57 and backfill start
        shell: bash
        run: |
          set -euo pipefail
          FULL_URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic/full"
          DIAG_URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic"
          VERSION_OK=0
          for i in $(seq 1 40); do
            DIAG="$(curl -fsS --max-time 30 "$DIAG_URL" || true)"
            FULL="$(curl -fsS --max-time 30 "$FULL_URL" || true)"
            echo "Attempt $i diagnostic: $DIAG"
            echo "Attempt $i full: $FULL"
            if echo "$DIAG" | grep -q '"workerVersion":"worker-v57-ledger-backfill-gate"' \
              && echo "$FULL" | grep -q '"version":"v57-ledger-backfill-gate"' \
              && echo "$FULL" | grep -q '"ledgerBackfillGate":true' \
              && echo "$FULL" | grep -q '"persistentAccountingLedger":true'; then
              VERSION_OK=1
              if echo "$DIAG" | grep -Eq '"backfill":\{[^}]*"(phase|processed|complete)"' \
                || echo "$DIAG" | grep -Eq '"event_count":[1-9][0-9]*'; then
                echo 'Cloudflare v57 is live and ledger backfill has started'
                exit 0
              fi
            fi
            sleep 15
          done
          if [ "$VERSION_OK" -eq 1 ]; then
            echo 'v57 is live but ledger backfill did not start'
          else
            echo 'Cloudflare did not reach v57 within verification window'
          fi
          exit 1
