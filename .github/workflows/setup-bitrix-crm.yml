name: Configure Bitrix CRM containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for CRM setup worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 36); do
            CODE="$(curl -sS -o /tmp/status.json -w '%{http_code}' --connect-timeout 10 --max-time 40 "$BASE/bitrix/crm/setup/status" || true)"
            echo "attempt=$i code=$CODE body=$(head -c 1000 /tmp/status.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ] && grep -q 'worker-v91-bitrix-crm-containers' /tmp/status.json; then break; fi
            sleep 10
          done
          grep -q 'worker-v91-bitrix-crm-containers' /tmp/status.json

      - name: Create container pipeline and stages
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          CODE="$(curl -sS -o /tmp/pipeline.json -w '%{http_code}' --connect-timeout 10 --max-time 180 "$BASE/bitrix/crm/setup/pipeline" || true)"
          echo "code=$CODE"; cat /tmp/pipeline.json
          test "$CODE" = "200"
          grep -q '"ok":true' /tmp/pipeline.json
          grep -q 'КОНТЕЙНЕРЫ — ОПЕРАЦИОННЫЙ УЧЕТ' /tmp/pipeline.json

      - name: Create container fields
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for BATCH in 1 2 3; do
            OK=0
            for TRY in 1 2 3; do
              CODE="$(curl -sS -o /tmp/fields-$BATCH.json -w '%{http_code}' --connect-timeout 10 --max-time 180 "$BASE/bitrix/crm/setup/fields?batch=$BATCH" || true)"
              echo "batch=$BATCH try=$TRY code=$CODE"; cat /tmp/fields-$BATCH.json
              if [ "$CODE" = "200" ] && grep -q '"ok":true' /tmp/fields-$BATCH.json; then OK=1; break; fi
              sleep 8
            done
            test "$OK" = "1"
          done

      - name: Verify CRM setup
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          curl -sS --connect-timeout 10 --max-time 120 "$BASE/bitrix/crm/setup/status" | tee /tmp/final.json
          grep -q 'КОНТЕЙНЕРЫ — ОПЕРАЦИОННЫЙ УЧЕТ' /tmp/final.json
          grep -q 'Новая заявка' /tmp/final.json
          grep -q 'Выдано / закрыто' /tmp/final.json
          grep -Eq '"fieldCount":(14|1[4-9]|[2-9][0-9])' /tmp/final.json
          echo 'BITRIX_CRM_CONTAINERS_READY'
