name: Inspect Bitrix catalogs and stores once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for v112 and print catalog info
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 24); do
            CODE="$(curl -sS -o /tmp/info.json -w '%{http_code}' --connect-timeout 10 --max-time 60 "$BASE/bitrix/catalog-info" || true)"
            echo "attempt=$i code=$CODE body=$(cat /tmp/info.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ] && grep -q 'worker-v112-catalog-info' /tmp/info.json; then
              exit 0
            fi
            sleep 8
          done
          exit 1
