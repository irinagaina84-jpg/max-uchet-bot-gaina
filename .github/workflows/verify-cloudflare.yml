name: Verify MAX bot v71

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build current Docker image
        run: docker build -t max-bot-current .
      - name: Verify reliable webhook and durable export sources
        shell: bash
        run: |
          set -euo pipefail
          node --check worker-v70.js
          node --check worker-v71.js
          grep -q 'BOT_IMAGE_REVISION=v71-reliable-webhook-20260828-1' Dockerfile
          grep -q 'node patch-v71-reliable-webhook.mjs' Dockerfile
          grep -q 'worker-v71-reliable-webhook-runtime' worker-v71.js
          grep -q '/bot/health' worker-v71.js
          grep -q 'worker-v70-durable-storage-export' worker-v70.js
          grep -q 'durable-storage' worker-v70.js
          grep -Eq '"main"[[:space:]]*:[[:space:]]*"worker-v71\.js"' wrangler.jsonc
          echo 'v71 source is buildable'

  verify-live:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Cloudflare and verify bot runtime, webhook and export
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 36); do
            BOT_CODE="$(curl -sS -o /tmp/bot.txt -w '%{http_code}' --connect-timeout 10 --max-time 45 "$BASE/bot/health" || true)"
            EXPORT_CODE="$(curl -sS -o /tmp/export.txt -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/export/health" || true)"
            WEBHOOK_CODE="$(curl -sS -o /tmp/webhook.txt -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/max-webhook" || true)"
            MEDIA_CODE="$(curl -sS -o /tmp/media.txt -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/export/media?mode=all" || true)"
            echo "===== ATTEMPT $i ====="
            echo "bot=$BOT_CODE body=$(head -c 1600 /tmp/bot.txt 2>/dev/null || true)"
            echo "export=$EXPORT_CODE body=$(head -c 800 /tmp/export.txt 2>/dev/null || true)"
            echo "webhook=$WEBHOOK_CODE body=$(head -c 800 /tmp/webhook.txt 2>/dev/null || true)"
            echo "media=$MEDIA_CODE body=$(head -c 300 /tmp/media.txt 2>/dev/null || true)"
            if [ "$BOT_CODE" = "200" ] \
              && grep -q '"version":"v71-reliable-webhook"' /tmp/bot.txt \
              && grep -q '"webhookConfigured":true' /tmp/bot.txt \
              && [ "$EXPORT_CODE" = "200" ] \
              && grep -q '"source":"durable-storage"' /tmp/export.txt \
              && [ "$WEBHOOK_CODE" = "200" ] \
              && grep -q '"webhook":"ready"' /tmp/webhook.txt \
              && [ "$MEDIA_CODE" = "403" ] \
              && grep -q 'Forbidden' /tmp/media.txt; then
              echo 'LIVE_V71_BOT_AND_EXPORT_OK'
              exit 0
            fi
            sleep 15
          done
          echo 'LIVE_V71_NOT_READY'
          exit 1
