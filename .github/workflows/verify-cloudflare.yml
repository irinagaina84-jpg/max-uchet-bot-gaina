name: Diagnose MAX bot v59

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build current Docker image
        run: docker build -t max-bot-current .
      - name: Verify v59 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BOT_IMAGE_REVISION=v59-resumable-ledger' Dockerfile
          grep -q 'node patch-v59-resumable-ledger.mjs' Dockerfile
          grep -q 'worker-v59-resumable-ledger' worker-v57.js
          echo 'v59 source is buildable'

  diagnose-live:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Dump live diagnostics and detect stall
        shell: bash
        run: |
          set -euo pipefail
          FULL_URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic/full"
          DIAG_URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic"
          PREV=""
          for i in 1 2 3 4; do
            DIAG="$(curl -fsS --max-time 30 "$DIAG_URL" || true)"
            FULL="$(curl -fsS --max-time 30 "$FULL_URL" || true)"
            echo "===== ATTEMPT $i DIAGNOSTIC ====="
            echo "$DIAG"
            echo "===== ATTEMPT $i FULL ====="
            echo "$FULL"
            CUR="$(printf '%s' "$FULL" | sed -n 's/.*"ledgerBackfillProcessed":\([0-9][0-9]*\).*/\1/p' | head -1)"
            echo "PROCESSED=${CUR:-unknown}"
            if [ -n "$PREV" ] && [ -n "$CUR" ] && [ "$CUR" -gt "$PREV" ]; then
              echo "PROGRESS_ADVANCED=$PREV->$CUR"
              exit 0
            fi
            PREV="$CUR"
            sleep 20
          done
          echo 'NO_PROGRESS_DETECTED'
          exit 1
