name: Ops v72 command debug

on:
  push:
    branches:
      - ops/v72-command-debug-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read live command diagnostics
        shell: bash
        run: |
          set -u
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'

          DIAG_CODE="$(curl -sS -A 'curl/8.0' -o /tmp/diag.json -w '%{http_code}' --connect-timeout 10 --max-time 90 "$BASE/diagnostic" || true)"
          BOT_CODE="$(curl -sS -A 'curl/8.0' -o /tmp/bot.json -w '%{http_code}' --connect-timeout 10 --max-time 90 "$BASE/bot/health" || true)"
          EXPORT_CODE="$(curl -sS -A 'curl/8.0' -o /tmp/export.json -w '%{http_code}' --connect-timeout 10 --max-time 90 "$BASE/export/health?chat_id=-76058846422497" || true)"

          echo "diagnostic_status=$DIAG_CODE"
          echo "bot_status=$BOT_CODE"
          echo "export_status=$EXPORT_CODE"

          COMMAND="$(jq -r '.container.lastPrivateText // ""' /tmp/bot.json 2>/dev/null || true)"
          RECEIVED_AT="$(jq -r '.container.lastPrivateAt // ""' /tmp/bot.json 2>/dev/null || true)"
          SENT_AT="$(jq -r '.container.lastSendAt // ""' /tmp/bot.json 2>/dev/null || true)"
          SEND_ERROR="$(jq -r '.container.lastSendError // "none"' /tmp/bot.json 2>/dev/null || true)"
          VERSION="$(jq -r '.container.version // "unknown"' /tmp/bot.json 2>/dev/null || true)"
          AUTH="$(jq -r '.container.maxAuthorized // false' /tmp/bot.json 2>/dev/null || true)"
          WEBHOOK="$(jq -r '.container.webhookConfigured // false' /tmp/bot.json 2>/dev/null || true)"
          CHATS="$(jq -r '.knownChatCount // 0' /tmp/diag.json 2>/dev/null || true)"
          EXPORT_VERSION="$(jq -r '.version // "unknown"' /tmp/export.json 2>/dev/null || true)"
          EXPORT_READABLE="$(jq -r '.readable // false' /tmp/export.json 2>/dev/null || true)"

          {
            echo '## Live MAX bot command status'
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Bot version | $VERSION |"
            echo "| MAX authorized | $AUTH |"
            echo "| Webhook configured | $WEBHOOK |"
            echo "| Known chats | $CHATS |"
            echo "| Last command | $COMMAND |"
            echo "| Command received at | $RECEIVED_AT |"
            echo "| Outgoing message sent at | $SENT_AT |"
            echo "| Send error | $SEND_ERROR |"
            echo "| Export version | $EXPORT_VERSION |"
            echo "| Selected chat storage readable | $EXPORT_READABLE |"
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$GITHUB_STEP_SUMMARY"
          exit 0
