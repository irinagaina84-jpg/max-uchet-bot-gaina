name: Verify MAX bot v63

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build current Docker image
        run: docker build -t max-bot-current .
      - name: Verify v63 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BOT_IMAGE_REVISION=v63-safe-ledger-export' Dockerfile
          grep -q 'node patch-v63-safe-ledger-export-link.mjs' Dockerfile
          grep -q 'worker-v63-safe-ledger-export' worker-v57.js
          grep -q '/export/history' worker-v57.js
          echo 'v63 source is buildable'

  verify-live:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Cloudflare Git integration and verify live v63
        shell: bash
        run: |
          set -euo pipefail
          FULL_URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic/full"
          DIAG_URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic"
          for i in $(seq 1 30); do
            DIAG="$(curl -fsS --max-time 30 "$DIAG_URL" || true)"
            FULL="$(curl -fsS --max-time 30 "$FULL_URL" || true)"
            echo "===== ATTEMPT $i ====="
            echo "$DIAG"
            echo "$FULL"
            if echo "$DIAG" | grep -q '"workerVersion":"worker-v63-safe-ledger-export"' && echo "$FULL" | grep -q '"version":"v63-safe-ledger-export"'; then
              echo 'LIVE_V63_OK'
              exit 0
            fi
            sleep 20
          done
          echo 'LIVE_V63_NOT_READY'
          exit 1
