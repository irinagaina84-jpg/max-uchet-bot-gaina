name: Configure Bitrix CRM card

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for v92
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 36); do
            CODE="$(curl -sS -o /tmp/audit.json -w '%{http_code}' --connect-timeout 10 --max-time 40 "$BASE/bitrix/crm/audit" || true)"
            echo "attempt=$i code=$CODE body=$(head -c 900 /tmp/audit.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ] && grep -q 'worker-v92-bitrix-crm-card' /tmp/audit.json; then break; fi
            sleep 10
          done
          grep -q 'worker-v92-bitrix-crm-card' /tmp/audit.json

      - name: Add operational status
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          CODE="$(curl -sS -o /tmp/status-field.json -w '%{http_code}' --connect-timeout 10 --max-time 180 "$BASE/bitrix/crm/setup/ops-status" || true)"
          echo "code=$CODE"; cat /tmp/status-field.json
          test "$CODE" = "200"
          grep -q '"ok":true' /tmp/status-field.json

      - name: Add container section safely
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          CODE="$(curl -sS -o /tmp/card.json -w '%{http_code}' --connect-timeout 10 --max-time 180 "$BASE/bitrix/crm/setup/card" || true)"
          echo "code=$CODE"; cat /tmp/card.json
          test "$CODE" = "200"
          grep -q '"ok":true' /tmp/card.json

      - name: Audit result
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          curl -sS --connect-timeout 10 --max-time 120 "$BASE/bitrix/crm/audit" | tee /tmp/final.json
          grep -Eq '"fieldCount":(15|1[5-9]|[2-9][0-9])' /tmp/final.json
          grep -q 'UF_CRM_OP_STATUS' /tmp/final.json
          echo 'BITRIX_CRM_CARD_READY'
