name: Organize Bitrix working files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for v87 and organize Bitrix
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 36); do
            CODE="$(curl -sS -o /tmp/status.json -w '%{http_code}' --connect-timeout 10 --max-time 40 "$BASE/bitrix/rebuild/status" || true)"
            echo "wait=$i code=$CODE body=$(head -c 700 /tmp/status.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ] && grep -q 'worker-v87-bitrix-resilient-structure' /tmp/status.json; then break; fi
            sleep 10
          done
          grep -q 'worker-v87-bitrix-resilient-structure' /tmp/status.json
          for STAGE in folders move cleanup; do
            echo "=== $STAGE ==="
            OK=0
            for TRY in 1 2 3; do
              CODE="$(curl -sS -o /tmp/$STAGE.json -w '%{http_code}' --connect-timeout 10 --max-time 180 "$BASE/bitrix/rebuild/$STAGE" || true)"
              echo "try=$TRY code=$CODE"
              cat /tmp/$STAGE.json
              if [ "$CODE" = "200" ] && grep -q '"ok":true' /tmp/$STAGE.json; then OK=1; break; fi
              sleep 8
            done
            test "$OK" = "1"
            sleep 3
          done
          curl -sS --connect-timeout 10 --max-time 90 "$BASE/bitrix/rebuild/status" | tee /tmp/final.json
          grep -q '01 ИНТЕРФОРТУМ' /tmp/final.json
          grep -q '02 АМИДИ ГРУПП' /tmp/final.json
          grep -q '00 КАРТОЧКА И РЕКВИЗИТЫ' /tmp/final.json
          echo 'BITRIX_WORKING_FILES_ORGANIZED'
