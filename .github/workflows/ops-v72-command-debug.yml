name: Ops v72 command debug

on:
  push:
    branches:
      - ops/v72-command-debug-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read live command diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request

          base = 'https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'

          def load(path):
              req = urllib.request.Request(base + path, headers={'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  raw = response.read().decode('utf-8', 'replace')
                  try:
                      return response.status, json.loads(raw)
                  except Exception:
                      return response.status, {'raw': raw}

          for round_no in range(1, 3):
              print(f'===== ROUND {round_no} =====')
              status, diag = load('/diagnostic')
              print('diagnostic_status=', status)
              print('knownChats=', json.dumps(diag.get('knownChats'), ensure_ascii=False))
              print('runtime=', json.dumps(diag.get('runtime'), ensure_ascii=False))
              recent = diag.get('recentUpdates') or []
              print('recentUpdates_tail=', json.dumps(recent[-15:], ensure_ascii=False))

              status, bot = load('/bot/health')
              container = bot.get('container') or {}
              keys = [
                  'startedAt', 'version', 'maxAuthorized', 'webhookConfigured',
                  'knownGroupCount', 'lastGroupChatId', 'lastGroupName',
                  'lastUpdateType', 'lastUpdateAt', 'lastPrivateSenderId',
                  'lastPrivateText', 'lastPrivateAt', 'lastSendAt',
                  'lastSendError', 'lastError', 'lastAiError'
              ]
              summary = {key: container.get(key) for key in keys}
              print('bot_status=', status)
              print('bot_runtime=', bot.get('runtime'))
              print('bot_summary=', json.dumps(summary, ensure_ascii=False))

              status, export = load('/export/health?chat_id=-76058846422497')
              print('export_status=', status)
              print('export=', json.dumps(export, ensure_ascii=False))
              if round_no == 1:
                  time.sleep(8)
          PY
