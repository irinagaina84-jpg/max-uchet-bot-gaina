name: Mail.ru month export

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month in YYYY-MM format'
        required: true
        default: '2026-01'
  push:
    paths:
      - '.github/mailru-export-month.txt'

permissions:
  contents: read

jobs:
  export-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve month
        id: month
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MONTH="${{ inputs.month }}"
          else
            MONTH="$(tr -d '[:space:]' < .github/mailru-export-month.txt)"
          fi
          if ! [[ "$MONTH" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]]; then
            echo "Invalid month: $MONTH" >&2
            exit 1
          fi
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "Export month: $MONTH"

      - name: Install mail dependencies
        run: npm install --no-save imapflow mailparser

      - name: Export month
        env:
          MAILRU_LOGIN: ${{ secrets.MAILRU_LOGIN }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
          MAILRU_MONTH: ${{ steps.month.outputs.month }}
          MAILRU_OUT_DIR: mailru-export
        run: node scripts/mailru-month-export.mjs

      - name: Upload month files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailru-${{ steps.month.outputs.month }}
          path: mailru-export/
          if-no-files-found: warn
          retention-days: 30
