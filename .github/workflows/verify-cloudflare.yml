name: Verify Cloudflare rollback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for known-good v42 rollout
        shell: bash
        run: |
          set -euo pipefail
          URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic/full"
          for i in $(seq 1 24); do
            BODY="$(curl -fsS --max-time 20 "$URL" || true)"
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q '"workerVersion":"worker-v42-max-history-fixed"' \
              && echo "$BODY" | grep -q '"version":"v42-max-history-fixed"' \
              && echo "$BODY" | grep -q '"maxAuthorized":true' \
              && echo "$BODY" | grep -q '"gigachatAuthorized":true'; then
              echo "Cloudflare known-good v42 is live"
              exit 0
            fi
            sleep 15
          done
          echo "Cloudflare did not return to known-good v42 within 6 minutes"
          exit 1
