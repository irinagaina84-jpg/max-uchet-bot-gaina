name: Verify MAX bot v64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build current Docker image
        run: docker build -t max-bot-current .
      - name: Verify v64 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BOT_IMAGE_REVISION=v64-media-export-20260827-1' Dockerfile
          grep -q 'node patch-v64-media-export-command.mjs' Dockerfile
          grep -q 'worker-v64-media-export' worker-v64.js
          grep -q '/export/media' worker-v64.js
          grep -q 'main.*worker-v64.js' wrangler.jsonc
          echo 'v64 source is buildable'

  verify-live:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Cloudflare Git integration and verify live v64
        shell: bash
        run: |
          set -euo pipefail
          MEDIA_URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/export/media"
          DIAG_URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic"
          for i in $(seq 1 30); do
            CODE="$(curl -sS -o /tmp/media_body.txt -w '%{http_code}' --max-time 30 "$MEDIA_URL" || true)"
            BODY="$(cat /tmp/media_body.txt 2>/dev/null || true)"
            DIAG="$(curl -fsS --max-time 30 "$DIAG_URL" || true)"
            echo "===== ATTEMPT $i ====="
            echo "media status=$CODE body=$BODY"
            echo "$DIAG"
            if [ "$CODE" = "403" ] && echo "$BODY" | grep -q 'Forbidden'; then
              echo 'LIVE_V64_MEDIA_EXPORT_OK'
              exit 0
            fi
            sleep 20
          done
          echo 'LIVE_V64_NOT_READY'
          exit 1
