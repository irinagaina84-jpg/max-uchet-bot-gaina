name: Setup Bitrix project model

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for worker and create project model
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for i in $(seq 1 30); do
            CODE="$(curl -sS -o /tmp/result.json -w '%{http_code}' --connect-timeout 10 --max-time 180 "$BASE/bitrix/setup-project-model" || true)"
            echo "attempt=$i code=$CODE"
            cat /tmp/result.json 2>/dev/null || true
            echo
            if [ "$CODE" = "200" ] && grep -q '"ok":true' /tmp/result.json && grep -q 'worker-v107-project-model' /tmp/result.json; then
              echo 'BITRIX_PROJECT_MODEL_READY'
              exit 0
            fi
            sleep 10
          done
          exit 1
