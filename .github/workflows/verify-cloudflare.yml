name: Verify MAX bot v73

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build current Docker image
        run: docker build -t max-bot-current .
      - name: Verify historical backfill and durable ZIP sources
        shell: bash
        run: |
          set -euo pipefail
          node --check worker-v70.js
          node --check worker-v71.js
          node --check worker-v72.js
          node --check patch-v72-multichat-export-command.mjs
          grep -q 'BOT_IMAGE_REVISION=v73-history-archive-export-20260828-1' Dockerfile
          grep -q 'node patch-v72-multichat-export-command.mjs' Dockerfile
          grep -q 'commandSmokePattern' patch-v72-multichat-export-command.mjs
          grep -q 'historyRows' patch-v72-multichat-export-command.mjs
          grep -q 'ledgerRequest("/raw"' patch-v72-multichat-export-command.mjs
          grep -q 'v73-history-archive-export' patch-v72-multichat-export-command.mjs
          grep -q 'worker-v73-history-archive-runtime-r1' worker-v71.js
          grep -q 'worker-v72-multichat-durable-export' worker-v72.js
          grep -q 'rawRangePage(chatId' worker-v72.js
          grep -q 'X-MAX-Chat-Id' worker-v72.js
          grep -Eq '"main"[[:space:]]*:[[:space:]]*"worker-v72\.js"' wrangler.jsonc
          echo 'v73 historical backfill ZIP source is buildable'

  verify-live:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Cloudflare and verify bot runtime and selected-chat export
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          CHAT='-76058846422497'
          for i in $(seq 1 36); do
            BOT_CODE="$(curl -sS -o /tmp/bot.txt -w '%{http_code}' --connect-timeout 10 --max-time 45 "$BASE/bot/health" || true)"
            EXPORT_CODE="$(curl -sS -o /tmp/export.txt -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/export/health?chat_id=$CHAT" || true)"
            WEBHOOK_CODE="$(curl -sS -o /tmp/webhook.txt -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/max-webhook" || true)"
            MEDIA_CODE="$(curl -sS -o /tmp/media.txt -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE/export/media?mode=all&chat_id=$CHAT" || true)"
            echo "===== ATTEMPT $i ====="
            echo "bot=$BOT_CODE body=$(head -c 1800 /tmp/bot.txt 2>/dev/null || true)"
            echo "export=$EXPORT_CODE body=$(head -c 1000 /tmp/export.txt 2>/dev/null || true)"
            echo "webhook=$WEBHOOK_CODE body=$(head -c 800 /tmp/webhook.txt 2>/dev/null || true)"
            echo "media=$MEDIA_CODE body=$(head -c 300 /tmp/media.txt 2>/dev/null || true)"
            if [ "$BOT_CODE" = "200" ] \
              && grep -q '"version":"v73-history-archive-export"' /tmp/bot.txt \
              && grep -q '"webhookConfigured":true' /tmp/bot.txt \
              && [ "$EXPORT_CODE" = "200" ] \
              && grep -q '"version":"worker-v72-multichat-durable-export"' /tmp/export.txt \
              && grep -q '"chatId":"-76058846422497"' /tmp/export.txt \
              && grep -q '"readable":true' /tmp/export.txt \
              && [ "$WEBHOOK_CODE" = "200" ] \
              && grep -q '"webhook":"ready"' /tmp/webhook.txt \
              && [ "$MEDIA_CODE" = "403" ] \
              && grep -q 'Forbidden' /tmp/media.txt; then
              echo 'LIVE_V73_HISTORY_BACKFILL_ZIP_READY'
              exit 0
            fi
            sleep 15
          done
          echo 'LIVE_V73_NOT_READY'
          exit 1
