name: Verify Cloudflare rollout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for safe v44 rollout
        shell: bash
        run: |
          set -euo pipefail
          URL="https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev/diagnostic/full"
          for i in $(seq 1 24); do
            BODY="$(curl -fsS --max-time 20 "$URL" || true)"
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q '"workerVersion":"worker-v43-history-access-diagnostic"' \
              && echo "$BODY" | grep -q '"version":"v44-current-chat-history"'; then
              echo "Cloudflare safe v44 container is live"
              exit 0
            fi
            sleep 15
          done
          echo "Cloudflare did not reach safe v44 within 6 minutes"
          exit 1
