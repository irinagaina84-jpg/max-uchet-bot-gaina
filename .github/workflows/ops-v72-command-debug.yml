name: Ops v72 command debug

on:
  push:
    branches:
      - ops/v72-command-debug-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read live command diagnostics
        shell: bash
        run: |
          set -u
          BASE='https://max-uchet-bot-gaina.irina-gaina-84-036.workers.dev'
          for ROUND in 1 2; do
            echo "===== ROUND $ROUND ====="

            DIAG_CODE="$(curl -sS -A 'curl/8.0' -o /tmp/diag.json -w '%{http_code}' --connect-timeout 10 --max-time 90 "$BASE/diagnostic" || true)"
            echo "diagnostic_status=$DIAG_CODE"
            if jq -e . /tmp/diag.json >/dev/null 2>&1; then
              echo -n 'knownChats='; jq -c '.knownChats' /tmp/diag.json
              echo -n 'runtime='; jq -c '.runtime' /tmp/diag.json
              echo -n 'recentUpdates_tail='; jq -c '(.recentUpdates // [])[-15:]' /tmp/diag.json
            else
              echo -n 'diagnostic_body='; head -c 2000 /tmp/diag.json || true; echo
            fi

            BOT_CODE="$(curl -sS -A 'curl/8.0' -o /tmp/bot.json -w '%{http_code}' --connect-timeout 10 --max-time 90 "$BASE/bot/health" || true)"
            echo "bot_status=$BOT_CODE"
            if jq -e . /tmp/bot.json >/dev/null 2>&1; then
              echo -n 'bot_runtime='; jq -c '.runtime' /tmp/bot.json
              echo -n 'bot_summary='; jq -c '{startedAt:.container.startedAt,version:.container.version,maxAuthorized:.container.maxAuthorized,webhookConfigured:.container.webhookConfigured,knownGroupCount:.container.knownGroupCount,lastGroupChatId:.container.lastGroupChatId,lastGroupName:.container.lastGroupName,lastUpdateType:.container.lastUpdateType,lastUpdateAt:.container.lastUpdateAt,lastPrivateSenderId:.container.lastPrivateSenderId,lastPrivateText:.container.lastPrivateText,lastPrivateAt:.container.lastPrivateAt,lastSendAt:.container.lastSendAt,lastSendError:.container.lastSendError,lastError:.container.lastError,lastAiError:.container.lastAiError}' /tmp/bot.json
            else
              echo -n 'bot_body='; head -c 2000 /tmp/bot.json || true; echo
            fi

            EXPORT_CODE="$(curl -sS -A 'curl/8.0' -o /tmp/export.json -w '%{http_code}' --connect-timeout 10 --max-time 90 "$BASE/export/health?chat_id=-76058846422497" || true)"
            echo "export_status=$EXPORT_CODE"
            echo -n 'export='; cat /tmp/export.json || true; echo

            [ "$ROUND" = "1" ] && sleep 8
          done
